server {
    listen 80;
    server_name 52.66.238.162;

    # Route API and Admin to Django
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Route static files to Django/WhiteNoise
    location /static/ {
        proxy_pass http://backend:8000;
    }

    # Route everything else to Next.js
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
    }
}

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mock_interview_backend_prod
    restart: always
    env_file:
      - .env.prod
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://52.66.238.162  # Port removed
    container_name: mock_interview_frontend_prod
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://52.66.238.162  # Port removed

  nginx:
    image: nginx:alpine
    container_name: mock_interview_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend